name: Publish The Last Address

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare standalone game
        run: node deploy/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Activate game
        id: publish
        uses: actions/deploy-pages@v5
        with:
          # The large standalone file can finish syncing after ten minutes.
          timeout: '1800000'
