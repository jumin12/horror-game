services:
  - type: web
    name: horror-game
    runtime: static
    branch: main
    buildCommand: node deploy/build.mjs
    staticPublishPath: ./public
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
